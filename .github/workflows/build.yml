name: Build OfflineTranslate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Download model
        # Модель (191 МБ) не коммитится в репозиторий (.gitignore),
        # поэтому скачиваем официальный файл с HF-хаба argos-translate.
        run: |
          curl -L --fail --retry 3 \
            -o dist/translate-en_ru-1_9.argosmodel \
            https://huggingface.co/argos-translate/argos-translate/resolve/main/translate-en_ru-1_9.argosmodel

      - name: Create tarball
        run: |
          cd dist
          tar -czf OfflineTranslate-Linux.tar.gz OfflineTranslate translate-en_ru-1_9.argosmodel

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslate-Linux
          path: dist/OfflineTranslate-Linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Download model
        # Модель (191 МБ) не коммитится в репозиторий (.gitignore),
        # поэтому скачиваем официальный файл с HF-хаба argos-translate.
        run: |
          curl -L --fail --retry 3 `
            -o dist/translate-en_ru-1_9.argosmodel `
            https://huggingface.co/argos-translate/argos-translate/resolve/main/translate-en_ru-1_9.argosmodel

      - name: Create zip archive
        run: |
          cd dist
          Compress-Archive -Path OfflineTranslate.exe,translate-en_ru-1_9.argosmodel -DestinationPath OfflineTranslate-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslate-Windows
          path: dist/OfflineTranslate-Windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: OfflineTranslate-Linux
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: OfflineTranslate-Windows
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
