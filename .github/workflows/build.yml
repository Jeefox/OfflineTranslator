name: Build OfflineTranslator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # ручной запуск: сборка + артефакты, без Release

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    env:
      # build.py and the downloader use the same platform-independent path.
      XDG_CACHE_HOME: ${{ runner.temp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-сборка torch (без CUDA-библиотек) — компактный артефакт.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download bundled Marian models
        run: python -m scripts.download_release_models

      - name: Build (PyInstaller onedir)
        run: python build.py

      - name: Archive
        run: tar -czf OfflineTranslator-Linux.tar.gz -C dist OfflineTranslator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-Linux
          path: OfflineTranslator-Linux.tar.gz
          retention-days: 30

  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    env:
      LOCALAPPDATA: ${{ runner.temp }}\OfflineTranslator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download bundled Marian models
        run: python -m scripts.download_release_models

      - name: Build (PyInstaller onedir)
        run: python build.py

      - name: Archive
        run: Compress-Archive -Path dist/OfflineTranslator -DestinationPath OfflineTranslator-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-Windows
          path: OfflineTranslator-Windows.zip
          retention-days: 30

  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download bundled Marian models
        run: python -m scripts.download_release_models

      - name: Build (PyInstaller onedir)
        run: python build.py

      - name: Archive
        run: tar -czf OfflineTranslator-macOS.tar.gz -C dist OfflineTranslator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-macOS
          path: OfflineTranslator-macOS.tar.gz
          retention-days: 30

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'  # только push тега; workflow_dispatch — без Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/OfflineTranslator-Linux/OfflineTranslator-Linux.tar.gz
            release-assets/OfflineTranslator-Windows/OfflineTranslator-Windows.zip
            release-assets/OfflineTranslator-macOS/OfflineTranslator-macOS.tar.gz
