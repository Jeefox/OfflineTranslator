name: Build OfflineTranslator

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gguf:
        description: Build an additional Linux GGUF executable
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-release.txt
      - run: xvfb-run -a python scripts/run_tests.py

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-latest
            platform: Windows
          - os: macos-15
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install CPU runtime
        if: runner.os != 'macOS'
        run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-release.txt
      - name: Build executable without model weights
        run: python build.py
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OfflineTranslator.exe -DestinationPath OfflineTranslator-Windows.zip
      - name: Archive Unix executable
        if: runner.os != 'Windows'
        run: tar -czf OfflineTranslator-${{ matrix.platform }}.tar.gz -C dist OfflineTranslator
      - name: Split only oversized archives
        shell: bash
        run: |
          for archive in OfflineTranslator-*.zip OfflineTranslator-*.tar.gz; do
            if [ -f "$archive" ]; then python -m scripts.split_release_archive "$archive"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-${{ matrix.platform }}
          path: |
            OfflineTranslator-*.zip*
            OfflineTranslator-*.tar.gz*
          if-no-files-found: error
          retention-days: 30

  gguf-build:
    if: github.event_name == 'workflow_dispatch' && inputs.gguf
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-release.txt -r requirements-gguf.txt
      - run: python -c "import llama_cpp; print(llama_cpp.__version__)"
      - run: python tests/test_llama_cpp_backend.py
      - run: python build.py
        env:
          OFFLINE_TRANSLATOR_BUILD_GGUF: "1"
      - run: tar -czf OfflineTranslator-Linux-GGUF.tar.gz -C dist OfflineTranslator
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-Linux-GGUF
          path: OfflineTranslator-Linux-GGUF.tar.gz

  models:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: Package separate Marian models
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install download dependency
        run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-release.txt
      - name: Download and package models
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}
        run: |
          python -m scripts.download_release_models
          python -m scripts.package_release_models
          python -m scripts.split_release_archive OfflineTranslator-Models-Marian.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-Models-Marian
          path: OfflineTranslator-Models-Marian.zip*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, models]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Calculate checksums
        working-directory: release-assets
        run: sha256sum OfflineTranslator-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release-assets/*
          body: |
            Приложение и модели скачиваются отдельно.

            1. Скачайте и распакуйте архив приложения для своей ОС.
            2. Для стандартного Marian-перевода скачайте OfflineTranslator-Models-Marian.zip
               и распакуйте папку models рядом с исполняемым файлом.
            3. Если у вас уже есть модели, архив моделей скачивать не нужно:
               укажите папки совместимых Marian-моделей или GGUF Hy-MT2 в Настройках.

            Исполняемые файлы не содержат весов и не скачивают модели при запуске.
            Для EN→RU и RU→EN можно подключить модели независимо.
            Произвольные архитектуры GGUF/Transformers не поддерживаются.

            SHA256SUMS.txt содержит контрольные суммы архивов.
            Если архив превышает лимит GitHub, скачайте все его части .001, .002, …
            и объедините их перед распаковкой (cat на Unix, copy /b на Windows).
