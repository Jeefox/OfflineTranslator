name: Build OfflineTranslate

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Download model
        # Модель не коммитится в репозиторий (.gitignore),
        # скачиваем через huggingface_hub напрямую (без hf-cli).
        run: |
          pip install huggingface-hub
          python -c "
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id='shethjenil/argostranslate',
              filename='translate-en_ru.argosmodel',
              local_dir='dist',
              force_download=True
          )
          "
          # Шаги упаковки ниже ожидают имя translate-en_ru-1_9.argosmodel
          python -c "import os; os.replace('dist/translate-en_ru.argosmodel', 'dist/translate-en_ru-1_9.argosmodel')"

      - name: Create tarball
        run: |
          cd dist
          tar -czf OfflineTranslate-Linux.tar.gz OfflineTranslate translate-en_ru-1_9.argosmodel

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslate-Linux
          path: dist/OfflineTranslate-Linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Download model
        # Модель не коммитится в репозиторий (.gitignore),
        # скачиваем через huggingface_hub напрямую (без hf-cli).
        run: |
          pip install huggingface-hub
          python -c "
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id='shethjenil/argostranslate',
              filename='translate-en_ru.argosmodel',
              local_dir='dist',
              force_download=True
          )
          "
          # Шаги упаковки ниже ожидают имя translate-en_ru-1_9.argosmodel
          python -c "import os; os.replace('dist/translate-en_ru.argosmodel', 'dist/translate-en_ru-1_9.argosmodel')"

      - name: Create zip archive
        run: |
          cd dist
          Compress-Archive -Path OfflineTranslate.exe,translate-en_ru-1_9.argosmodel -DestinationPath OfflineTranslate-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslate-Windows
          path: dist/OfflineTranslate-Windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: OfflineTranslate-Linux
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: OfflineTranslate-Windows
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
